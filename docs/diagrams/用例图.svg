<svg xmlns="http://www.w3.org/2000/svg" width="920" height="710" viewBox="0 0 920 710"
     font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">

  <!-- 白底：GitHub 深色主题下也保证线条和文字可读 -->
  <rect x="0" y="0" width="920" height="710" fill="#ffffff"/>

  <defs>
    <!-- 依赖关系（include / extend）用的空心箭头 -->
    <marker id="open-arrow" viewBox="0 0 12 12" refX="11" refY="6"
            markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#333" stroke-width="1.4"/>
    </marker>
  </defs>

  <text x="20" y="30" font-size="17" font-weight="bold" fill="#111">图 5-1　CBK 数据备份软件系统用例图</text>

  <!-- ===================== 参与者 ===================== -->
  <g stroke="#111" stroke-width="1.8" fill="none">
    <circle cx="70" cy="290" r="15"/>
    <line x1="70" y1="305" x2="70" y2="350"/>
    <line x1="45" y1="318" x2="95" y2="318"/>
    <line x1="70" y1="350" x2="48" y2="385"/>
    <line x1="70" y1="350" x2="92" y2="385"/>
  </g>
  <text x="70" y="408" font-size="15" text-anchor="middle" fill="#111">用户</text>

  <!-- ===================== 系统边界 ===================== -->
  <rect x="180" y="60" width="710" height="530" rx="6"
        fill="none" stroke="#555" stroke-width="1.6"/>
  <text x="535" y="86" font-size="15" text-anchor="middle" fill="#555">CBK 数据备份软件</text>

  <!-- ===================== 用例 ===================== -->
  <g fill="#f7f9fb" stroke="#1d4e89" stroke-width="1.8">
    <ellipse cx="360" cy="140" rx="105" ry="31"/>
    <ellipse cx="360" cy="240" rx="105" ry="31"/>
    <ellipse cx="360" cy="340" rx="105" ry="31"/>
    <ellipse cx="360" cy="440" rx="105" ry="31"/>
    <ellipse cx="360" cy="540" rx="105" ry="31"/>
    <ellipse cx="720" cy="150" rx="98" ry="31"/>
    <ellipse cx="720" cy="300" rx="98" ry="31"/>
  </g>
  <g font-size="14.5" text-anchor="middle" fill="#111">
    <text x="360" y="136">UC-01</text><text x="360" y="154">备份目录树</text>
    <text x="360" y="236">UC-02</text><text x="360" y="254">还原备份</text>
    <text x="360" y="336">UC-03</text><text x="360" y="354">列出备份内容</text>
    <text x="360" y="436">UC-04</text><text x="360" y="454">校验备份完整性</text>
    <text x="360" y="536">UC-05</text><text x="360" y="554">查询支持的算法</text>
    <text x="720" y="146">UC-06</text><text x="720" y="164">设置密码</text>
    <text x="720" y="296">UC-07</text><text x="720" y="314">读取备份索引</text>
  </g>

  <!-- ===================== 关联（参与者 — 用例） ===================== -->
  <g stroke="#111" stroke-width="1.5" fill="none">
    <line x1="95" y1="300" x2="255" y2="146"/>
    <line x1="97" y1="308" x2="255" y2="243"/>
    <line x1="98" y1="318" x2="255" y2="340"/>
    <line x1="97" y1="326" x2="255" y2="437"/>
    <line x1="95" y1="334" x2="255" y2="534"/>
  </g>

  <!-- ===================== «extend»：UC-06 扩展 UC-01 / UC-02 ===================== -->
  <!-- 箭头由扩展用例指向被扩展的基用例，方向不能画反 -->
  <g stroke="#333" stroke-width="1.4" fill="none" stroke-dasharray="7 5"
     marker-end="url(#open-arrow)">
    <line x1="622" y1="145" x2="467" y2="141"/>
    <line x1="628" y1="168" x2="463" y2="228"/>
  </g>
  <text x="545" y="132" font-size="13" text-anchor="middle" fill="#333">«extend»</text>
  <text x="556" y="212" font-size="13" text-anchor="middle" fill="#333">«extend»</text>

  <!-- ===================== «include»：UC-02 / UC-03 包含 UC-07 ===================== -->
  <!-- 箭头由基用例指向被包含的用例 -->
  <g stroke="#333" stroke-width="1.4" fill="none" stroke-dasharray="7 5"
     marker-end="url(#open-arrow)">
    <line x1="465" y1="252" x2="623" y2="288"/>
    <line x1="465" y1="337" x2="623" y2="312"/>
  </g>
  <text x="546" y="286" font-size="13" text-anchor="middle" fill="#333">«include»</text>
  <text x="546" y="343" font-size="13" text-anchor="middle" fill="#333">«include»</text>

  <!-- ===================== 扩展点说明 ===================== -->
  <g font-size="12.5" fill="#666">
    <text x="720" y="200" text-anchor="middle">扩展点：用户选择了加密算法</text>
    <text x="720" y="218" text-anchor="middle">（备份）／包已加密（还原）</text>
  </g>

  <!-- ===================== 图例 ===================== -->
  <g transform="translate(180,612)">
    <rect x="0" y="0" width="710" height="52" rx="4" fill="#fbfbfb" stroke="#ccc" stroke-width="1"/>
    <text x="12" y="31" font-size="12.5" font-weight="bold" fill="#333">图例</text>
    <line x1="56" y1="27" x2="96" y2="27" stroke="#111" stroke-width="1.5"/>
    <text x="104" y="31" font-size="12.5" fill="#333">关联（参与者发起）</text>
    <line x1="248" y1="27" x2="288" y2="27" stroke="#333" stroke-width="1.4"
          stroke-dasharray="7 5" marker-end="url(#open-arrow)"/>
    <text x="296" y="31" font-size="12.5" fill="#333">«include» 基用例必然执行被包含用例</text>
    <line x1="560" y1="27" x2="600" y2="27" stroke="#333" stroke-width="1.4"
          stroke-dasharray="7 5" marker-end="url(#open-arrow)"/>
    <text x="608" y="31" font-size="12.5" fill="#333">«extend» 条件扩展</text>
  </g>
</svg>
