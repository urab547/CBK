# cpplint 配置。CI 会跑 cpplint --recursive code/core code/cli。
#
# cpplint 是照 Google 官方风格写的，我们改了缩进宽度，
# 所以关掉几条与缩进/换行有关的检查；其余全部保留。

set noparent
linelength=100
root=code/core/include

filter=-whitespace/indent
filter=-whitespace/indent_namespace
filter=-whitespace/newline
filter=-whitespace/braces
filter=-readability/braces
filter=-build/c++11
