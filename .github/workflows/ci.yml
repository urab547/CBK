name: CI

# 每次 push 到 main、以及每个 Pull Request 都会跑。
# main 分支设了保护规则，这个流程不通过就合不进去。
#
# 这一个文件同时兑现评分表里的两项：
#   · 源码质量 → 是否能自动化构建
#   · PPT 得分 → 版本管理工具使用情况

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: 构建与测试 (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: code

    steps:
      - uses: actions/checkout@v5

      - name: 配置
        run: cmake --preset msvc

      - name: 构建
        run: cmake --build --preset release

      - name: 单元测试
        run: ctest --preset release

      - name: 冒烟测试 cbk info
        run: .\build\msvc\bin\Release\cbk.exe info

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安装界面依赖
        run: python -m pip install -r ../gui/requirements.txt

      - name: GUI 与进程桥回归测试
        run: python -m unittest discover -s ../gui -p "test_*.py" -v

      - name: 准备可运行的界面文件
        run: Copy-Item build/msvc/bin/Release/cbk.exe ../gui/cbk.exe

      - name: 上传可执行文件
        uses: actions/upload-artifact@v4
        with:
          name: cbk-windows-x64
          path: |
            gui/cbk.exe
            gui/gui.py
            gui/bridge.py
            gui/requirements.txt
            gui/README.md
          if-no-files-found: error

  lint:
    name: 代码规范检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安装 cpplint
        run: pip install cpplint

      - name: 检查 core 与 cli
        run: cpplint --recursive code/core code/cli

      - name: 检查 Python 界面代码
        run: |
          python -m pip install ruff==0.17.2
          python -m ruff check gui
          python -m ruff format --check gui
